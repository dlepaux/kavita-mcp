name: CI

# kavita-mcp CI, on GitHub-hosted runners only (every crate is on crates.io, so no job needs a
# registry secret):
#
#   - test:    fmt, clippy, audit, the version-bump check and cargo test, on x64 and arm64. Kavita is a
#              wiremock server inside the tests, so nothing external is needed. The only job a pull
#              request runs, with a read-only token and no secrets.
#   - release: semantic-release on push to main (tag, Cargo bump, changelog.md, GitHub release).
#   - docker:  on a release only, the linux/amd64 + linux/arm64 image to GHCR.
#
# Every action is pinned by commit SHA; the comment beside it names the tag it was resolved from.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the two jobs that publish widen it for themselves.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup on the image installs the toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Fail on any RustSec advisory.
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Release version bump is cargo-free and cargo-correct
        run: bash scripts/set-version.test.sh

      - name: Test
        run: cargo test --locked

  release:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      released: ${{ steps.relout.outputs.released }}
      version: ${{ steps.relout.outputs.version }}
    steps:
      # The release commit is pushed as this WRITE deploy key when main gets a ruleset (GITHUB_TOKEN
      # cannot push past one). Unset, checkout falls back to GITHUB_TOKEN, which is enough without a
      # ruleset. Only a push to main reaches this job, so no pull request can read the key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The vX.Y.Z tag on HEAD backs up the action's outputs: an empty one would silently skip docker.
      - name: Resolve release outputs
        id: relout
        env:
          PUBLISHED: ${{ steps.semrel.outputs.new_release_published }}
          VERSION: ${{ steps.semrel.outputs.new_release_version }}
        run: |
          set -eu
          published="$PUBLISHED"; version="$VERSION"
          if [ "$published" != 'true' ] || [ -z "$version" ]; then
            tag=$(git tag --points-at HEAD --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -n "$tag" ]; then
              published='true'
              version="${tag#v}"
            else
              published='false'
            fi
          fi
          {
            echo "released=${published}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          echo "release resolved: released=${published} version=${version:-<none>}"

  # Both architectures from one x64 runner: the Dockerfile cross-compiles on $BUILDPLATFORM and its
  # runtime stage runs nothing, so no emulation is needed.
  docker:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # The release tag, not github.sha: the version bump is a commit after the triggering one, and the
      # binary must report the version its image is tagged with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.release.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ needs.release.outputs.version }}
          # metadata-action takes the version label from the FIRST tag, `latest`, and the description
          # from the repository's About text, and its labels override the Dockerfile's. Both are set
          # here so the image says what the code says, whatever the About text reads that day.
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.description=MCP server letting each person in a household search their Kavita libraries and send a book to their Kindle, as themselves, after a confirmation.

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            GIT_SHA=${{ github.sha }}
